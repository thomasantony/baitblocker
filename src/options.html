<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BaitBlocker</title>
<style>
  :root { color-scheme: light dark; --muted: #6b7280; --border: #d1d5db; --ok: #15803d; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --muted: #9ca3af; --border: #374151; --ok: #4ade80; --err: #f87171; } }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 28px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  label { display: block; margin: 10px 0; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  input[type=text], input[type=password], input[type=number], select { padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; font: inherit; background: transparent; color: inherit; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; }
  input[type=number] { width: 110px; }
  button { font: inherit; padding: 4px 12px; cursor: pointer; }
  .muted { color: var(--muted); }
  .status { margin-left: 8px; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  table { border-collapse: collapse; } td { padding: 2px 16px 2px 0; }
</style>
</head>
<body>
<h1>BaitBlocker</h1>
<div class="muted">Hides US-politics and ideology bait from accounts based outside the US.</div>

<h2>d1 API</h2>
<label>API key <input id="apiKey" type="password" autocomplete="off" placeholder="liquid_…"></label>
<div class="row">
  <label>Model <select id="model"><option value="d1.1">d1.1</option><option value="d1-ultra">d1-ultra</option></select></label>
  <label>Daily input-token budget <input id="budget" type="number" min="0" step="10000"></label>
</div>
<label><input id="scoreImages" type="checkbox"> Send attached photos to d1 (about 180 extra input tokens per photo)</label>

<h2>Filtering</h2>
<label>Never filter accounts based in (comma-separated, as X shows them) <input id="allowed" type="text"></label>
<div class="row">
  <label>Hide at score ≥ <input id="tHide" type="number" min="0" max="1" step="0.01"></label>
  <label>Blur at score ≥ <input id="tBlur" type="number" min="0" max="1" step="0.01"></label>
</div>
<button id="save">Save</button><span id="saveStatus" class="status"></span>

<h2>Today</h2>
<table id="stats"></table>
<button id="refresh">Refresh</button>

<script src="options.js"></script>
</body>
</html>
